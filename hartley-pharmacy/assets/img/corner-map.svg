<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="cm-t cm-d"><title id="cm-t">Map of our corner</title><desc id="cm-d">Hartley Pharmacy sits on the corner of Bleecker Street and Grove Street. The 1 train at Christopher Street is one block north on Seventh Avenue South, about two minutes on foot. The West 4th Street station is east on Sixth Avenue, about six minutes.</desc>
