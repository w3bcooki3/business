<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-labelledby="dm-t dm-d"><title id="dm-t">Free delivery zone map</title><desc id="dm-d">Simplified map of lower Manhattan west side. The shaded free-delivery zone runs from the Hudson River east to Broadway and Lafayette Street, and from West 23rd Street south to Canal Street, covering Chelsea below 23rd, the West Village, Greenwich Village and SoHo. Hartley Pharmacy is marked at Bleecker and Grove.</desc>
